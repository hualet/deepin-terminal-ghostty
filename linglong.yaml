version: "1"

package:
  id: org.deepin.terminal-ghostty
  name: deepin-terminal-ghostty
  version: 1.0.4.0
  kind: app
  description: |
    Terminal emulator for deepin, powered by Ghostty's VT engine.

command:
  - /opt/apps/org.deepin.terminal-ghostty/files/bin/deepin-terminal-ghostty

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/25.2.2

# sources:
#   - kind: git
#     url: https://github.com/hualet/deepin-terminal-ghostty.git
#     version: main
#     commit: 29dda5e8423ac36449f68bfb71ac41e4df4f9798

build: |
  cmake -B build \
    -DCMAKE_INSTALL_PREFIX=${PREFIX} \
    -DCMAKE_INSTALL_LIBDIR=${PREFIX}/lib/${TRIPLET} \
    -DCMAKE_BUILD_TYPE=Release
  cmake --build build --parallel "$(nproc)"
  cmake --build build --target install

buildext:
  apt:
    build_depends:
      - libglx-dev
      - libopengl-dev
    depends: []
