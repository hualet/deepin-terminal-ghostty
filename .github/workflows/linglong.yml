name: Build Linglong Package

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  build-linglong:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ll-builder-build
        uses: myml/linglong-builder-action@main
        with:
          format: uab

      - name: Upload Linglong package
        uses: actions/upload-artifact@v4
        with:
          name: linglong-package
          path: ./*.uab

      - name: Publish release assets
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ./*.uab
          generate_release_notes: ${{ github.event_name == 'push' }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
